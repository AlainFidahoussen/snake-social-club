AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Snake Social Club - deploys the app to a single EC2 instance running Docker,
  backed by an Aurora PostgreSQL Serverless v2 cluster. DB credentials live in
  Secrets Manager and are generated once at stack creation; re-running this
  template (create-or-update with no changes to the Secret resource) never
  rotates them, since CloudFormation only regenerates a GenerateSecretString
  value when the Secret resource itself is created or replaced.

Parameters:
  InstanceType:
    Type: String
    Default: t3.medium
    AllowedValues: [t3.small, t3.medium, t3.large]
    Description: >
      EC2 instance type for the app host. Needs enough memory to run
      `npm ci` / `vite build` and `docker build` at boot.

  DBName:
    Type: String
    Default: snake_social_club
    Description: Name of the initial Aurora PostgreSQL database.

  DBEngineVersion:
    Type: String
    Default: "16.9"
    Description: Aurora PostgreSQL engine version (must support Serverless v2 scaling).

  DBMinCapacity:
    Type: Number
    Default: 0.5
    Description: Minimum Aurora Serverless v2 capacity, in ACUs.

  DBMaxCapacity:
    Type: Number
    Default: 4
    Description: Maximum Aurora Serverless v2 capacity, in ACUs.

Resources:
  # --- Networking -------------------------------------------------------
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-vpc"

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.0.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-public-1"

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-public-2"

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  # --- Security groups ----------------------------------------------------
  EC2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow inbound HTTP to the app
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

  DBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow Postgres access from the app instance only
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref EC2SecurityGroup

  # --- Secret (generated once; stack re-runs do not rotate it) -----------
  DBSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${AWS::StackName}-db-credentials"
      Description: Aurora PostgreSQL master credentials for Snake Social Club.
      GenerateSecretString:
        SecretStringTemplate: '{"username": "snake_admin"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludePunctuation: true

  # --- Database ------------------------------------------------------------
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnets for the Aurora cluster
      SubnetIds:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2

  DBCluster:
    Type: AWS::RDS::DBCluster
    Properties:
      Engine: aurora-postgresql
      EngineMode: provisioned
      EngineVersion: !Ref DBEngineVersion
      DatabaseName: !Ref DBName
      MasterUsername: !Sub "{{resolve:secretsmanager:${DBSecret}:SecretString:username}}"
      MasterUserPassword: !Sub "{{resolve:secretsmanager:${DBSecret}:SecretString:password}}"
      DBSubnetGroupName: !Ref DBSubnetGroup
      VpcSecurityGroupIds:
        - !Ref DBSecurityGroup
      StorageEncrypted: true
      ServerlessV2ScalingConfiguration:
        MinCapacity: !Ref DBMinCapacity
        MaxCapacity: !Ref DBMaxCapacity

  DBInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      Engine: aurora-postgresql
      DBInstanceClass: db.serverless
      DBClusterIdentifier: !Ref DBCluster
      PubliclyAccessible: false

  # --- EC2 host --------------------------------------------------------------
  EC2Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: ReadDBSecret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref DBSecret

  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref EC2Role

  EC2Instance:
    Type: AWS::EC2::Instance
    DependsOn: DBInstance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: "{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}"
      SubnetId: !Ref PublicSubnet1
      SecurityGroupIds:
        - !Ref EC2SecurityGroup
      IamInstanceProfile: !Ref EC2InstanceProfile
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-app"
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          exec > /var/log/user-data.log 2>&1

          dnf install -y docker git
          systemctl enable --now docker
          usermod -aG docker ec2-user

          git clone --depth 1 https://github.com/AlainFidahoussen/snake-social-club.git /opt/app

          SECRET_JSON=$(aws secretsmanager get-secret-value --secret-id '${DBSecret}' --region '${AWS::Region}' --query SecretString --output text)
          DB_USER=$(python3 -c "import json,sys; print(json.load(sys.stdin)['username'])" <<< "$SECRET_JSON")
          DB_PASS=$(python3 -c "import json,sys; print(json.load(sys.stdin)['password'])" <<< "$SECRET_JSON")
          DB_HOST='${DBCluster.Endpoint.Address}'
          DB_PORT='${DBCluster.Endpoint.Port}'
          DB_NAME='${DBName}'

          DATABASE_URL="postgresql+psycopg://$DB_USER:$DB_PASS@$DB_HOST:$DB_PORT/$DB_NAME"

          docker build -t snake-app /opt/app
          docker run -d --name snake-app --restart unless-stopped -p 80:8000 -e DATABASE_URL="$DATABASE_URL" snake-app

  AppEIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc

  AppEIPAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      InstanceId: !Ref EC2Instance
      AllocationId: !GetAtt AppEIP.AllocationId

Outputs:
  AppURL:
    Description: Public URL of the app
    Value: !Sub "http://${AppEIP}"

  InstanceId:
    Description: EC2 instance ID (connect via `aws ssm start-session --target <id>`)
    Value: !Ref EC2Instance

  DBClusterEndpoint:
    Description: Aurora cluster writer endpoint
    Value: !GetAtt DBCluster.Endpoint.Address

  DBSecretArn:
    Description: Secrets Manager ARN holding the DB username/password
    Value: !Ref DBSecret
