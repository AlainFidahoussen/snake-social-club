[project]
name = "backend"
version = "0.1.0"
description = "FastAPI backend implementing the Serpent.io API contract (openapi.yaml)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "psycopg[binary]>=3.3.4",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx2>=2.10",
    "ipython>=9.16.1",
    "pytest>=8.3",
]
